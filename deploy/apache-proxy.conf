# Trecho para painel.lsisistemas.com.br.conf (VirtualHost *:80)
# e default-ssl.conf (VirtualHost *:443)
#
# IMPORTANTE: /api/horse/ deve vir ANTES de /api/

ProxyPreserveHost On
ProxyTimeout 300

ProxyPass        /api/horse/ http://127.0.0.1:9001/
ProxyPassReverse /api/horse/ http://127.0.0.1:9001/

ProxyPass        /api/ http://127.0.0.1:5000/api/
ProxyPassReverse /api/ http://127.0.0.1:5000/api/
